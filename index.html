<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0038C6">
  <title>কুলফিক্স — ম্যানেজার প্যানেল</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --blue: #0038C6;
      --sky: #009FFD;
      --blue-light: #E6F4FF;
      --green: #3E9E00;
      --lime: #58CC02;
      --green-light: #EEFCE6;
      --amber: #B7791F;
      --amber-light: #FFF6E0;
      --red: #CF1322;
      --red-light: #FFF1F0;
      --white: #FFFFFF;
      --text: #0A1931;
      --muted: #526484;
      --line: #DCEAFB;
      --bg: #EEF4FB;
      --shadow: 0 2px 10px rgba(10, 25, 49, .06);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'Hind Siliguri', 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }
    button { font-family: inherit; }
    .num { font-family: 'Inter', sans-serif; }

    .app {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      background: var(--bg);
      padding-bottom: 86px;
      position: relative;
    }

    /* ===== Header ===== */
    .hdr {
      background: linear-gradient(135deg, var(--blue), var(--sky));
      color: #fff;
      padding: 14px 16px 18px;
      position: sticky;
      top: 0;
      z-index: 40;
      border-radius: 0 0 22px 22px;
      box-shadow: 0 6px 18px rgba(0, 56, 198, .22);
    }
    .hdr-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .brand { display: flex; align-items: center; gap: 10px; }
    .logo {
      width: 42px; height: 42px; border-radius: 13px; background: #fff; color: var(--blue);
      display: flex; align-items: center; justify-content: center;
      font: 800 16px 'Inter', sans-serif; flex-shrink: 0;
    }
    .logo span { color: var(--green); }
    .brand h1 { font-size: 17px; font-weight: 700; line-height: 1.2; }
    .brand small { font-size: 11px; opacity: .9; display: flex; align-items: center; gap: 5px; }
    .live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--lime); box-shadow: 0 0 0 3px rgba(88,204,2,.3); }
    .hdr-actions { display: flex; gap: 6px; align-items: center; }
    .pill-btn {
      background: rgba(255,255,255,.2); border: 1px solid rgba(255,255,255,.4); color: #fff;
      padding: 6px 10px; border-radius: 16px; font: 700 12px 'Inter', 'Hind Siliguri', sans-serif; cursor: pointer;
    }
    .pill-btn.muted { background: rgba(0,0,0,.25); }
    .round-btn {
      width: 32px; height: 32px; border-radius: 50%; background: #fff; color: var(--blue);
      border: none; font-size: 16px; font-weight: 700; cursor: pointer;
    }

    .wrap { padding: 14px 14px 0; }

    /* ===== Alarm ===== */
    .alarm {
      display: none; align-items: center; justify-content: space-between; gap: 8px;
      background: var(--amber-light); border: 1.5px solid #F2C94C; border-radius: 14px;
      padding: 10px 12px; margin-bottom: 12px; animation: pulse 1.2s infinite;
    }
    .alarm.show { display: flex; }
    .alarm strong { display: block; font-size: 13px; color: #7A4F01; }
    .alarm small { font-size: 11px; color: #8C6214; }
    .alarm button { background: var(--red); color: #fff; border: none; padding: 8px 12px; border-radius: 10px; font-size: 12px; font-weight: 700; cursor: pointer; white-space: nowrap; }
    @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(242,201,76,.5);} 50% { box-shadow: 0 0 0 6px rgba(242,201,76,0);} }

    /* ===== Stats ===== */
    .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 14px; }
    .stat {
      background: #fff; border-radius: 16px; padding: 12px 12px 12px 14px; box-shadow: var(--shadow);
      border-left: 4px solid var(--sky);
    }
    .stat.g { border-left-color: var(--lime); }
    .stat.a { border-left-color: #F2B01E; }
    .stat small { display: block; font-size: 12px; color: var(--muted); font-weight: 600; }
    .stat strong { display: block; font: 800 21px 'Inter', sans-serif; color: var(--blue); margin-top: 2px; }
    .stat.g strong { color: var(--green); }
    .stat.a strong { color: var(--amber); }

    /* ===== Search & filters ===== */
    .search {
      width: 100%; padding: 12px 14px; border: 1.5px solid var(--line); border-radius: 14px;
      font: 500 14px 'Hind Siliguri', 'Inter', sans-serif; background: #fff; outline: none; margin-bottom: 10px;
    }
    .search:focus { border-color: var(--blue); }
    .chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 4px; scrollbar-width: none; }
    .chips::-webkit-scrollbar { display: none; }
    .chip {
      padding: 7px 13px; border-radius: 18px; border: 1px solid var(--line); background: #fff; color: var(--muted);
      font: 700 12px 'Inter', 'Hind Siliguri', sans-serif; white-space: nowrap; cursor: pointer;
    }
    .chip.on { background: var(--blue); color: #fff; border-color: var(--blue); }
    .chip.tech.on { background: var(--green); border-color: var(--green); }
    .chip .c { opacity: .75; margin-left: 4px; }

    /* ===== Order card ===== */
    .card {
      background: #fff; border-radius: 18px; padding: 14px; margin-bottom: 14px;
      box-shadow: var(--shadow); border: 1px solid var(--line);
    }
    .card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .oid { font: 800 17px 'Inter', sans-serif; color: var(--blue); }
    .sched { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .tag { font: 700 11px 'Inter', sans-serif; padding: 5px 11px; border-radius: 12px; white-space: nowrap; }
    .st-Pending { background: var(--blue-light); color: var(--blue); border: 1px solid var(--sky); }
    .st-Accepted, .st-Assigned { background: var(--amber-light); color: #9A6700; border: 1px solid #F2C94C; }
    .st-On-the-way { background: #FFF0E0; color: #B45309; border: 1px solid #F5A55B; }
    .st-In-Progress { background: #EAE6FF; color: #4B2FC0; border: 1px solid #9B87F5; }
    .st-Completed { background: var(--green-light); color: var(--green); border: 1px solid var(--lime); }
    .st-Cancelled { background: #F4F6F9; color: var(--muted); border: 1px dashed var(--muted); }

    /* progress stepper */
    .steps { display: flex; align-items: flex-start; margin: 14px 2px 10px; }
    .step { flex: 1; text-align: center; position: relative; }
    .step::before {
      content: ''; position: absolute; top: 9px; left: -50%; width: 100%; height: 3px; background: var(--line); z-index: 0;
    }
    .step:first-child::before { display: none; }
    .step.done::before { background: var(--lime); }
    .dot {
      width: 21px; height: 21px; border-radius: 50%; background: #fff; border: 2.5px solid var(--line);
      margin: 0 auto; position: relative; z-index: 1; display: flex; align-items: center; justify-content: center;
      font-size: 11px; color: #fff; font-weight: 800;
    }
    .step.done .dot { background: var(--lime); border-color: var(--lime); }
    .step.now .dot { border-color: var(--blue); background: #fff; box-shadow: 0 0 0 4px rgba(0,56,198,.15); }
    .step span { display: block; font-size: 10px; color: var(--muted); margin-top: 4px; font-weight: 600; line-height: 1.2; }
    .step.done span, .step.now span { color: var(--text); }

    /* customer block */
    .cust { background: #F8FBFF; border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; margin-top: 4px; }
    .cust .nm { font-weight: 700; font-size: 15px; }
    .cust .ph { font: 600 13px 'Inter', sans-serif; color: var(--blue); margin-top: 1px; }
    .cust .ad { font-size: 13px; color: var(--muted); margin-top: 4px; line-height: 1.4; }
    .quick { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
    .quick a {
      text-decoration: none; text-align: center; padding: 8px 4px; border-radius: 10px; font-size: 12px; font-weight: 700;
      border: 1px solid var(--line); background: #fff; color: var(--blue);
    }
    .quick a.wa { color: #128C4A; border-color: #BDE8CF; background: #F1FBF5; }

    .tech-banner {
      display: flex; align-items: center; gap: 8px; margin-top: 10px; padding: 9px 12px; border-radius: 12px;
      background: var(--blue-light); border: 1px solid var(--sky); font-size: 13px;
    }
    .tech-banner.has { background: var(--green-light); border-color: var(--lime); }
    .tech-banner strong { color: var(--blue); }
    .tech-banner.has strong { color: var(--green); }

    .items { margin: 10px 0 4px; border: 1px dashed var(--line); border-radius: 12px; padding: 8px 10px; font-size: 13px; background: #FCFDFF; }
    .items .r { display: flex; justify-content: space-between; gap: 8px; padding: 3px 0; }
    .items .r b { font-family: 'Inter', sans-serif; color: var(--green); white-space: nowrap; }
    .total-row { display: flex; justify-content: space-between; align-items: center; font-weight: 700; margin-top: 6px; }
    .total-row .v { font: 800 17px 'Inter', sans-serif; color: var(--green); }

    /* work timer */
    .work-box {
      margin-top: 10px; border-radius: 14px; padding: 12px; text-align: center;
      background: linear-gradient(135deg, #4B2FC0, #7B5CF0); color: #fff;
    }
    .work-box small { display: block; font-size: 12px; opacity: .9; }
    .work-box .t { font: 800 28px 'Inter', sans-serif; letter-spacing: 1px; margin-top: 2px; }
    .done-box {
      margin-top: 10px; border-radius: 14px; padding: 10px 12px; background: var(--green-light);
      border: 1px solid #B8EB96; font-size: 13px; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap;
    }
    .done-box b { color: var(--green); }

    /* actions */
    .primary {
      width: 100%; margin-top: 12px; padding: 14px; border: none; border-radius: 14px; cursor: pointer;
      font: 700 15px 'Hind Siliguri', 'Inter', sans-serif; color: #fff; box-shadow: 0 6px 14px rgba(0,0,0,.12);
    }
    .primary:active { transform: scale(.985); }
    .p-accept { background: linear-gradient(135deg, #0077E6, var(--blue)); }
    .p-travel { background: linear-gradient(135deg, #F59E0B, #D97706); }
    .p-start { background: linear-gradient(135deg, #7B5CF0, #4B2FC0); }
    .p-finish { background: linear-gradient(135deg, var(--lime), var(--green)); }
    .p-bill { background: #fff; color: var(--green); border: 1.5px solid var(--green); box-shadow: none; }

    .ctrl { margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--line); }
    .lbl { display: block; font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 5px; }
    .sel {
      width: 100%; padding: 11px 10px; border-radius: 12px; border: 1.5px solid var(--line);
      font: 600 13px 'Hind Siliguri', 'Inter', sans-serif; background: #fff; color: var(--text); outline: none;
    }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
    .btn {
      padding: 10px; border-radius: 11px; border: none; font: 700 12.5px 'Hind Siliguri', 'Inter', sans-serif; cursor: pointer;
    }
    .btn-blue { background: var(--blue); color: #fff; }
    .btn-soft { background: var(--blue-light); color: var(--blue); border: 1px solid var(--line); }
    .btn-danger { background: var(--red-light); color: var(--red); border: 1px solid #FFA39E; }
    .more-toggle { width: 100%; margin-top: 10px; background: none; border: none; color: var(--muted); font-size: 12px; font-weight: 700; padding: 6px; cursor: pointer; }
    .bill-ok { font-size: 12px; color: var(--green); font-weight: 700; margin-top: 8px; }

    .empty { text-align: center; padding: 38px 16px; border: 1.5px dashed var(--line); border-radius: 18px; background: #fff; color: var(--muted); }
    .empty h3 { color: var(--blue); margin: 6px 0 4px; }

    /* technicians tab */
    .tech-card { display: flex; align-items: center; gap: 12px; background: #fff; border-radius: 16px; padding: 12px; margin-bottom: 10px; box-shadow: var(--shadow); border: 1px solid var(--line); cursor: pointer; }
    .avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--blue-light); color: var(--blue); display: flex; align-items: center; justify-content: center; font: 800 15px 'Inter', sans-serif; flex-shrink: 0; }
    .tech-card.busy .avatar { background: #EAE6FF; color: #4B2FC0; }
    .tech-card .info { flex: 1; min-width: 0; }
    .tech-card .info b { display: block; font-size: 14px; }
    .tech-card .info small { color: var(--muted); font-size: 12px; }
    .tech-card .rev { text-align: right; font: 800 14px 'Inter', sans-serif; color: var(--green); }
    .tech-card .rev small { display: block; font: 600 10px 'Hind Siliguri', sans-serif; color: var(--muted); }
    .sec-title { font-size: 14px; font-weight: 700; margin: 4px 2px 10px; color: var(--text); }

    /* bottom nav */
    .nav {
      position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px;
      background: #fff; border-top: 1px solid var(--line); display: flex; z-index: 50; padding: 6px 10px calc(6px + env(safe-area-inset-bottom));
      box-shadow: 0 -4px 14px rgba(0,56,198,.08);
    }
    .nav button { flex: 1; background: none; border: none; padding: 6px; font-size: 11px; font-weight: 700; color: var(--muted); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; }
    .nav button .ic { font-size: 20px; }
    .nav button.on { color: var(--blue); }

    .toast {
      position: fixed; top: 16px; left: 50%; transform: translateX(-50%); background: var(--blue); color: #fff;
      padding: 10px 18px; border-radius: 24px; font-size: 13px; font-weight: 600; z-index: 400; display: none;
      box-shadow: 0 4px 14px rgba(0,56,198,.35); max-width: 92%; text-align: center;
    }

    /* ===== Bottom sheet / bill wizard ===== */
    .backdrop { position: fixed; inset: 0; background: rgba(10,25,49,.55); z-index: 300; display: none; align-items: flex-end; justify-content: center; }
    .backdrop.show { display: flex; }
    .sheet {
      width: 100%; max-width: 480px; max-height: 94vh; background: #fff; border-radius: 22px 22px 0 0;
      display: flex; flex-direction: column; animation: slideUp .25s ease;
    }
    @keyframes slideUp { from { transform: translateY(40px); opacity: .4; } to { transform: none; opacity: 1; } }
    .sheet-head { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
    .sheet-title { display: flex; justify-content: space-between; align-items: center; }
    .sheet-title h2 { font-size: 16px; }
    .sheet-title small { color: var(--muted); font-size: 12px; display: block; font-weight: 500; }
    .x-btn { width: 32px; height: 32px; border-radius: 50%; border: none; background: #F1F5FA; font-size: 15px; cursor: pointer; color: var(--muted); }
    .wiz { display: flex; margin-top: 12px; }
    .wz { flex: 1; text-align: center; position: relative; font-size: 11px; font-weight: 700; color: var(--muted); }
    .wz::before { content: ''; position: absolute; top: 12px; left: -50%; width: 100%; height: 3px; background: var(--line); }
    .wz:first-child::before { display: none; }
    .wz.done::before, .wz.now::before { background: var(--lime); }
    .wz i { font-style: normal; width: 26px; height: 26px; border-radius: 50%; background: #fff; border: 2.5px solid var(--line); display: flex; align-items: center; justify-content: center; margin: 0 auto 3px; position: relative; z-index: 1; font: 800 12px 'Inter', sans-serif; }
    .wz.done i { background: var(--lime); border-color: var(--lime); color: #fff; }
    .wz.now i { border-color: var(--blue); color: var(--blue); box-shadow: 0 0 0 4px rgba(0,56,198,.12); }
    .wz.now { color: var(--text); }
    .sheet-body { padding: 14px 16px; overflow-y: auto; flex: 1; }
    .sheet-foot { padding: 10px 16px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); background: #fff; }
    .foot-total { display: flex; justify-content: space-between; align-items: center; font-weight: 700; margin-bottom: 8px; font-size: 14px; }
    .foot-total span:last-child { font: 800 18px 'Inter', sans-serif; color: var(--green); }
    .foot-btns { display: grid; grid-template-columns: 1fr 2fr; gap: 8px; }
    .foot-btns .btn { padding: 13px; font-size: 14px; }
    .foot-btns.one { grid-template-columns: 1fr; }
    .hint { font-size: 12.5px; color: var(--muted); margin-bottom: 10px; line-height: 1.45; }
    .qchips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    .qchip { padding: 6px 11px; border-radius: 14px; border: 1px dashed var(--blue); background: #fff; color: var(--blue); font-size: 12px; font-weight: 700; cursor: pointer; }
    .bl { background: #F8FBFF; border: 1px solid var(--line); border-radius: 14px; padding: 10px; margin-bottom: 10px; }
    .bl-grid { display: grid; grid-template-columns: 1fr 58px 84px 34px; gap: 6px; align-items: center; }
    .bl-grid.head { font-size: 10.5px; color: var(--muted); font-weight: 700; margin-bottom: 4px; padding: 0 2px; }
    .inp { width: 100%; padding: 9px 8px; border-radius: 9px; border: 1px solid var(--line); font: 500 13px 'Hind Siliguri', 'Inter', sans-serif; background: #fff; outline: none; }
    .inp:focus { border-color: var(--blue); }
    .inp.n { font-family: 'Inter', sans-serif; text-align: right; }
    .del { width: 34px; height: 34px; border-radius: 9px; border: 1px solid #FFA39E; background: var(--red-light); color: var(--red); font-weight: 700; cursor: pointer; }
    .line-total { text-align: right; font: 600 11px 'Inter', sans-serif; color: var(--muted); margin-top: 4px; }
    .add-line { width: 100%; padding: 11px; border-radius: 12px; border: 1.5px dashed var(--blue); background: #fff; color: var(--blue); font-weight: 700; font-size: 13px; cursor: pointer; }
    .disc-box { margin-top: 14px; background: #FFF9EB; border: 1px solid #F6DFA2; border-radius: 14px; padding: 12px; }
    .disc-box .lbl { color: #8C6214; }
    textarea.inp { min-height: 64px; resize: vertical; font-family: 'Hind Siliguri', 'Inter', sans-serif; }

    /* invoice */
    .inv { border: 1.5px solid var(--line); border-radius: 16px; overflow: hidden; background: #fff; }
    .inv-top { background: linear-gradient(135deg, var(--blue), var(--sky)); color: #fff; padding: 14px; display: flex; justify-content: space-between; align-items: center; }
    .inv-top b { font-size: 16px; display: block; }
    .inv-top small { opacity: .9; font-size: 11px; }
    .inv-top .no { text-align: right; font: 700 12px 'Inter', sans-serif; }
    .inv-sec { padding: 12px 14px; border-bottom: 1px dashed var(--line); }
    .inv-sec:last-child { border-bottom: none; }
    .inv-h { display: flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 700; color: var(--blue); margin-bottom: 8px; }
    .inv-h i { font-style: normal; width: 20px; height: 20px; border-radius: 50%; background: var(--blue); color: #fff; display: flex; align-items: center; justify-content: center; font: 800 11px 'Inter', sans-serif; }
    .inv-r { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; padding: 3px 0; }
    .inv-r small { color: var(--muted); display: block; font: 500 11px 'Inter', sans-serif; }
    .inv-r b { font-family: 'Inter', sans-serif; white-space: nowrap; }
    .inv-r.sub { border-top: 1px dashed var(--line); margin-top: 5px; padding-top: 7px; font-weight: 700; }
    .inv-r.disc b { color: var(--red); }
    .inv-grand { background: var(--green-light); display: flex; justify-content: space-between; align-items: center; padding: 14px; }
    .inv-grand span { font-weight: 700; }
    .inv-grand b { font: 800 22px 'Inter', sans-serif; color: var(--green); }
    .inv-meta { font-size: 12.5px; color: var(--muted); line-height: 1.55; }
    .inv-meta b { color: var(--text); }

    /* confirm dialog */
    .dlg { width: calc(100% - 40px); max-width: 360px; background: #fff; border-radius: 18px; padding: 18px; margin: auto; text-align: center; }
    .dlg h3 { font-size: 16px; margin-bottom: 6px; }
    .dlg p { font-size: 13px; color: var(--muted); margin-bottom: 14px; }
    .dlg .row2 { margin-top: 0; }
    #dlg-backdrop { align-items: center; }
    .nav button { position: relative; }
    .badge { position: absolute; top: 0; right: 22%; min-width: 17px; height: 17px; border-radius: 9px; background: var(--red); color: #fff; font: 700 10px 'Inter', sans-serif; display: none; align-items: center; justify-content: center; padding: 0 4px; }
    .badge.show { display: flex; }
    .avatar { overflow: hidden; }
    .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .avatar.lg { width: 92px; height: 92px; font-size: 30px; margin: 0 auto 8px; border: 3px solid var(--line); }
    .avatar.sm { width: 30px; height: 30px; font-size: 12px; }
    .tech-card.off { opacity: .6; }
    .off-tag { font: 700 10px 'Inter', sans-serif; background: #F4F6F9; color: var(--muted); border: 1px dashed var(--muted); border-radius: 8px; padding: 2px 7px; margin-left: 6px; }
    .tech-banner .avatar { flex-shrink: 0; }
    .field { margin-bottom: 12px; }
    .field .lbl .req { color: var(--red); }
    .upl { display: block; border: 1.5px dashed var(--blue); border-radius: 14px; padding: 12px; text-align: center; background: #F8FBFF; cursor: pointer; }
    .upl input { display: none; }

  function beep() {

  }

  window.savePay = async function () {
    if (!pf || pf.saving) return;
    var o = findOrder(pf.id); if (!o) return;
    var amt = Number(pf.amount) || 0, total = Number(o.total) || 0, due = dueOf(o);
    if (amt <= 0) return showToast(L('টাকার পরিমাণ দিন', 'Enter an amount'));
    if (total > 0 && amt > due) return showToast(L('বকেয়ার (' + money(due) + ') বেশি নেওয়া যাবে না', 'Cannot exceed due (' + money(due) + ')'));
    pf.saving = true; renderPay();
    var now = Date.now(), p = { amount: amt, method: pf.method, at: now, note: (pf.note || '').trim() };
    var paid = paidOf(o) + amt, nd = Math.max(0, total - paid);
    var ok = await sync(o, { payments: arrayUnion(p), paidAmount: paid, dueAmount: nd, paymentStatus: (total > 0 && nd <= 0) ? 'Paid' : 'Partial', lastPaymentAt: now });
    if (!pf) return;
    if (ok) { pf.saving = false; pf.rcpt = { amount: amt, method: pf.method, at: now, total: total, paid: paid, due: nd }; renderPay(); showToast(L('পেমেন্ট সেভ হয়েছে: ', 'Payment saved: ') + money(amt)); }
    else { pf.saving = false; renderPay(); }
  };

  function buildCustomers() {
    var m = {}, arr = [], i, k;
    for (i = 0; i < orders.length; i++) {
      var o = orders[i], a = o.address || {}, ph = normPhone(a.phone) || ('x' + oidOf(o));
      var c = m[ph] || (m[ph] = { phone: ph, name: '', addr: '', orders: [], billed: 0, due: 0, comp: 0, last: 0, note: '' });
      if (!c.name) c.name = a.name || ''; if (!c.addr) c.addr = a.fullAddress || '';
      c.orders.push(o);
      if (o.status === 'Completed') { c.billed += Number(o.total) || 0; c.due += dueOf(o); }
      var t = tms(o); if (t > c.last) c.last = t;
    }
    for (i = 0; i < COMPLAINTS.length; i++) { var p2 = normPhone(COMPLAINTS[i].customerPhone); if (m[p2]) m[p2].comp++; }
    for (k in m) { var cc = m[k], ov = CUSTS[k]; if (ov) { if (ov.name) cc.name = ov.name; if (ov.address) cc.addr = ov.address; cc.note = ov.note || ''; } arr.push(cc); }
    arr.sort(function (x, y) { return y.last - x.last; });
    return arr;
  }

  function repRange() {
    var n = new Date(), from, to, p = REP.period;
    if (p === 'today') { from = dayStart(Date.now()); to = from + 86400000; }
    else if (p === 'week') { to = dayStart(Date.now()) + 86400000; from = to - 7 * 86400000; }
    else if (p === 'month') { from = new Date(n.getFullYear(), n.getMonth(), 1).getTime(); to = new Date(n.getFullYear(), n.getMonth() + 1, 1).getTime(); }
    else if (p === 'year') { from = new Date(n.getFullYear(), 0, 1).getTime(); to = new Date(n.getFullYear() + 1, 0, 1).getTime(); }
    else { from = REP.from ? new Date(REP.from + 'T00:00:00').getTime() : 0; to = REP.to ? new Date(REP.to + 'T00:00:00').getTime() + 86400000 : 8.64e15; }
    return { from: from, to: to };

      h += '<div class="dsec"><h3>🛡 ' + L('ওয়ারেন্টির নিয়ম', 'Warranty') + '</h3>' + fld(L('ওয়ারেন্টির দিন', 'Warranty days'), '<input class="inp n" style="text-align:left" type="number" min="1" max="365" value="' + esc(SF.warrantyDays) + '" oninput="setSf(\'warrantyDays\',this.value)">') +
        fld(L('শর্ত ও ব্যতিক্রম (কাস্টমারকে পাঠানো হবে)', 'Terms & exclusions (sent to customer)'), '<textarea class="inp" style="min-height:80px" placeholder="' + esc(L(WARR_TERMS.bn, WARR_TERMS.en)) + '" oninput="setSf(\'warrantyTerms\',this.value)">' + esc(SF.warrantyTerms) + '</textarea>') + '</div>';
      h += '<div class="dsec"><h3>🛠 ' + L('সার্ভিস ও চার্জের তালিকা', 'Services & charges') + '</h3><div class="note-s" style="margin:0 0 8px">' + L('বিল তৈরির সময় এগুলো দ্রুত বাটন হিসেবে আসবে।', 'These appear as quick buttons while billing.') + '</div>';
      for (i = 0; i < SF.services.length; i++) h += '<div class="bl-grid" style="grid-template-columns:1fr 90px 34px;margin-bottom:6px"><input class="inp" value="' + esc(SF.services[i].name) + '" placeholder="' + L('সার্ভিসের নাম', 'Service') + '" oninput="setSvc(' + i + ',\'name\',this.value)"><input class="inp n" type="number" value="' + (SF.services[i].price || '') + '" placeholder="৳" oninput="setSvc(' + i + ',\'price\',this.value)"><button class="del" onclick="delSvc(' + i + ')">✕</button></div>';
      h += '<button class="add-line" onclick="addSvc()">+ ' + L('সার্ভিস যোগ করুন', 'Add service') + '</button></div>';
      h += '<div class="dsec"><h3>🔔 ' + L('নোটিফিকেশন ও ভাষা', 'Notifications & language') + '</h3><div class="row2" style="margin-top:0"><button class="btn btn-soft" onclick="toggleSound()">' + (soundOn ? '🔔 ' + L('অ্যালার্ম চালু', 'Alarm on') : '🔕 ' + L('অ্যালার্ম বন্ধ', 'Alarm off')) + '</button><button class="btn btn-soft" onclick="toggleLang()">' + L('Switch to English', 'বাংলায় বদলান') + '</button></div></div>';
      h += '<button class="primary p-finish" style="margin-top:0;margin-bottom:14px" onclick="saveSettings()">✓ ' + L('সেটিংস সেভ করুন', 'Save Settings') + '</button>';
      h += '<div class="dsec"><h3>👤 ' + L('কর্মী ও অনুমতি', 'Staff & roles') + '<span>' + STAFF.length + '</span></h3>';
      for (i = 0; i < STAFF.length; i++) { var s = STAFF[i], me = ME && ME.uid === s.uid; h += '<div class="mrow" style="cursor:default"><div class="' + (s.active === false ? 'void' : '') + '"><b>' + esc(s.name || '-') + (me ? ' (' + L('আপনি', 'you') + ')' : '') + '</b><small>' + esc(roleLabel(s.role)) + ' · ' + esc(s.phone || '') + '</small></div>' + (me ? '' : '<button class="btn btn-soft" style="padding:6px 10px" onclick="toggleStaff(\'' + esc(s.uid) + '\')">' + (s.active === false ? L('চালু', 'Enable') : L('বন্ধ', 'Disable')) + '</button>') + '</div>'; }
      h += '<button class="add-line" style="margin-top:8px" onclick="openStaffAdd()">+ ' + L('নতুন কর্মী', 'Add staff') + '</button></div>';
      h += '<div class="dsec"><h3>🧾 ' + L('কার্যকলাপের লগ', 'Activity log') + '<span>' + ALOGS.length + '</span></h3>';
      if (!ALOGS.length) h += '<div class="dnone">' + L('কোনো লগ নেই', 'No logs') + '</div>';
      for (i = 0; i < Math.min(30, ALOGS.length); i++) h += '<div class="mrow" style="cursor:default"><div><b>' + esc(ALOGS[i].action) + '</b> · ' + esc(ALOGS[i].name || '') + '<small>' + fmtDate(ALOGS[i].at) + ' ' + fmtTime(ALOGS[i].at) + ' · ' + esc(ALOGS[i].target || '') + (ALOGS[i].detail ? ' · ' + esc(ALOGS[i].detail) : '') + '</small></div></div>';
      h += '</div><div class="dsec"><h3>🔐 ' + L('তথ্য সংরক্ষণ নীতি', 'Data retention') + '</h3><div class="note-s">' + L('কাস্টমার ও টেকনিশিয়ানের ব্যক্তিগত তথ্য শুধু সেবার প্রয়োজনে সংগ্রহ ও সংরক্ষণ করা হয়। এনআইডি শুধু অ্যাডমিন দেখতে পারেন। কেউ তথ্য মুছে ফেলার অনুরোধ করলে অ্যাডমিন তা মুছবেন; হিসাবসংক্রান্ত তথ্য আইনি প্রয়োজনে রাখা হতে পারে।', 'Personal data is collected only for service. NID is visible to Admin only. Deletion requests are handled by Admin; accounting records may be kept for legal reasons.') + '</div></div>';
    }
    document.getElementById('view-more').innerHTML = h;
  }
  window.dashGoMore = function (k) { window.switchTab('more'); window.moreGo(k); };

  /* ---------- realtime listener ---------- */
  function applySnap(snapshot) {
    var fetched = [];
    snapshot.forEach(function (d) { fetched.push(Object.assign({ docId: d.id }, d.data())); });
    orders = fetched;
    detectNew();
    renderAll();
  }
  var ordersQuery = query(collection(db, ORDERS), orderBy("createdAt", "desc"), limit(1000));
  LS(ordersQuery, applySnap, function (error) {
    console.warn("Ordered query fallback:", error);
    unsubs.push(onSnapshot(collection(db, ORDERS), applySnap));
  });

  LS(collection(db, 'technicians'), function (snap) {
    var arr = [];
    snap.forEach(function (d) { arr.push(Object.assign({ id: d.id }, d.data())); });
    TECHS = arr;
    renderAll();
  }, function (e) { console.warn('technicians listener:', e); showToast(L('টেকনিশিয়ান লোড হয়নি (rules চেক করুন)', 'Could not load technicians (check rules)')); });

  LS(collection(db, 'complaints'), function (snap) {
    var arr = [], ids = [], fresh = false;
    snap.forEach(function (d) {
      var c = Object.assign({ docId: d.id }, d.data());
      arr.push(c);
      ids.push(d.id);
      if (!compFirst && knownCompIds.indexOf(d.id) === -1 && c.status === 'Open') fresh = true;
    });
    COMPLAINTS = arr;
    knownCompIds = ids;
    compFirst = false;
    if (fresh) triggerAlarm('complaint');
    renderAll();
  }, function (e) { console.warn('complaints listener:', e); });

  if (REQUIRE_LOGIN) { showLogin('loading'); setTimeout(function () { if (!authSeen) showLogin('form'); }, 6000); }
  if (!REQUIRE_LOGIN) { document.getElementById('login').style.display = 'none'; startListeners(); applyRoleNav(); }
  renderAll();
</script>
</body>
</html>
